[package]
name = "app-redirector"
edition = "2024"
description = "Redirector App"
version = "1.0.0"

[package.metadata.app]
account_id = "yeti"
schemas = "schemas/redirect.graphql"
resources = "resources/*.rs"
static = { path = "web", root = "/", source = "source", spa = true, build = "npm install && npm run build" }
loaders = { data = "data/*.json", auth = "auth/roles.json" }

[package.metadata.auth.basic]
enabled = true

[package.metadata.auth.jwt]
enabled = true

[dependencies]
tracing = "0.1"
