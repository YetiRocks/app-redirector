name: "Redirector App"
app_id: "app-redirector"
customer_id: "yeti"
version: "1.0.0"
description: "URL redirect management with rule checking, versioning, and bulk CSV upload"
schemas:
  path: schemas/redirect.graphql

resources:
  path: resources/*.rs
  root: /api

dataLoader: data/*.json

static:
  path: web
  root: /
  spa: true
  build:
    source: source
    command: npm install && npm run build
