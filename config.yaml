name: "Redirector App"
app_id: "app-redirector"
version: "1.0.0"
description: "URL redirect management with rule checking, versioning, and bulk CSV upload"
schemas:
  - schemas/redirect.graphql

resources:
  - resources/*.rs

dataLoader: data/*.json

static_files:
  path: web
  route: /
  index: index.html
  notFound:
    file: index.html
    statusCode: 200
  build:
    sourceDir: source
    command: npm run build
