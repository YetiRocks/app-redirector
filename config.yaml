name: "Redirector App"
app_id: "app-redirector"
customer_id: "yeti"
version: "1.0.0"
description: "URL redirect management with rule checking, versioning, and bulk CSV upload"
schemas:
  - schemas/redirect.graphql

resources:
  - resources/*.rs

dataLoader: data/*.json

static_files:
  path: web
  spa: true
  build:
    sourceDir: source
    command: npm run build
